<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="www/css/default.css">
    <title>Prova Online - Planilha</title>
  </head>
  <body>
    <div class="container">
      <h1>Avaliação Escrita</h1>

      <form id="provaForm">
        <input type="hidden" id="infoBrowser" name="navegador_versao" value="">
        <input type="hidden" name="atividade" value="ADS-D-POO">
        <div class="questao">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" required />
        </div>
        <div class="questao">
          <label for="turma">Turma:</label>
          <input type="text" id="turma" required />
        </div>
        <div class="questao">
          <label for="q1">1. O que é HTML?</label>
          <textarea id="q1" ></textarea>
        </div>
        <div class="questao">
          <label for="q2">2. Diferença entre h1 e p?</label>
          <textarea id="q2" ></textarea>
        </div>
        <div class="questao">
          <label for="q3">3. Para que serve o atributo alt?</label>
          <textarea id="q3" ></textarea>
        </div>
        <button type="submit">Enviar Respostas</button>
      </form>
      <div id="alerta-erro" class="card-erro escondido">
        <span class="icone">⚠️</span>
        <span id="mensagem-erro">Ocorreu um erro inesperado.</span>
        <button id="btn-fechar-erro" style="align-self: flex-start; width: auto; margin-left: auto; background: none; border: none; cursor: pointer; color: inherit; font-weight: bold;">✕</button>
      </div>
    </div>

  <script type="module" src="/www/scripts/form.js">
    
    </script>
  </body>
</html>
