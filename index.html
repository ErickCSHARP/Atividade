<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prova Online - Planilha</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        background: white;
        padding: 30px;
        margin: 0 auto;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .questao {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        height: 100px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Avaliação Escrita</h1>

      <form id="provaForm">
        <div class="questao">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" required />
        </div>
        <div class="questao">
          <label for="turma">Turma:</label>
          <input type="text" id="turma" required />
        </div>
        <div class="questao">
          <label for="q1">1. O que é HTML?</label>
          <textarea id="q1" required></textarea>
        </div>
        <div class="questao">
          <label for="q2">2. Diferença entre h1 e p?</label>
          <textarea id="q2" required></textarea>
        </div>
        <div class="questao">
          <label for="q3">3. Para que serve o atributo alt?</label>
          <textarea id="q3" required></textarea>
        </div>
        <button type="submit">Enviar Respostas</button>
      </form>
    </div>

    <script>
      document
        .getElementById("provaForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // INSIRA A SUA URL DO SHEETDB AQUI
          const SHEETDB_API_URL = "https://sheetdb.io/api/v1/yt8trp7wrpv3r";

          const dados = {
            data: [
              {
                id: new guid(),
                nome: document.getElementById("nome").value,
                data: new Date().toLocaleString("pt-BR"),   // formatar para dd/mm/aaaa hh:mm:ss
                //turma: document.getElementById("count").value,
                questao1: document.getElementById("q1").value,
                questao2: document.getElementById("q2").value,
                questao3: document.getElementById("q3").value,
                questao4: document.getElementById("q4").value,
                questao5: document.getElementById("q5").value,
                
              },
            ],
          };

          fetch(SHEETDB_API_URL, {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify(dados),
          })
            .then((response) => response.json())
            .then((data) => {
              alert(
                "Enviado com sucesso! Suas respostas foram gravadas.",
              );
              document.getElementById("provaForm").reset();
            })
            .catch((error) => {
              console.error("Erro:", error);
              alert("Erro ao enviar. Tente novamente.");
            });
        });
    </script>
  </body>
</html>
